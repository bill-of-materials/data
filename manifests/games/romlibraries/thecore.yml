# yaml-language-server: $schema=../../../schemas/billofmaterials.art/v1/games/romlibrary.json
apiVersion: billofmaterials.art/v1
kind: games/romlibrary
description: RetroArch library of thecore, built from the seeded fullsets
datpack:
  # parent/clone DATs first (No-Intro's grouping of regional versions, for --single),
  # then the standard pack for the DATs it lacks (Aftermarket)
  - /media/core/games/roms.incoming/No-Intro Love Pack (PC) (*).zip
  - /media/core/games/roms.incoming/No-Intro Love Pack (DAT) (*).zip
sourceRoot: /media/core/games/roms.incoming/No-Intro
outputRoot: /media/core/games/roms.lib
retroarchPlaylistPath: /media/core/games/roms.lib/_playlists/
defaults:
  mode: hardlink
  preferRegion: [FRA, EUR, WORLD, USA]
  preferLanguage: [FR, EN]
  filterLanguage: [EN, FR]
  onlyRetail: true
  bios: true
  enabled: true
